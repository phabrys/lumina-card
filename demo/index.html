<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumina Card — démo</title>
<style>
  /* Variables des thèmes par défaut de Home Assistant */
  .theme-light {
    --primary-background-color: #fafafa;
    --card-background-color: #ffffff;
    --ha-card-background: #ffffff;
    --primary-text-color: #141414;
    --secondary-text-color: #5e5e5e;
    --divider-color: rgba(0, 0, 0, 0.12);
    --primary-color: #009ac7;
    --state-light-active-color: #ffb300;
    --state-fan-active-color: #00bcd4;
    --state-climate-cool-color: #2b9af9;
    --state-climate-heat-color: #ff8100;
    --success-color: #43a047;
    --warning-color: #ef6c00;
    --error-color: #db4437;
    color-scheme: light;
  }
  .theme-dark {
    --primary-background-color: #111111;
    --card-background-color: #1c1c1c;
    --ha-card-background: #1c1c1c;
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --divider-color: rgba(225, 225, 225, 0.12);
    --primary-color: #009ac7;
    --state-light-active-color: #ffb300;
    --state-fan-active-color: #00bcd4;
    --state-climate-cool-color: #2b9af9;
    --state-climate-heat-color: #ff8100;
    --success-color: #45a14a;
    --warning-color: #ff9800;
    --error-color: #ef5350;
    color-scheme: dark;
  }
  body { margin: 0; font-family: Roboto, "Segoe UI", system-ui, sans-serif; }
  .theme { background: var(--primary-background-color); padding: 24px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; align-items: start; }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: var(--secondary-text-color); margin: 0 0 6px 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Horloge figée à 17:30 du jour (?now=HH:MM pour une autre heure), qui
  // continue d'avancer pour les comptes à rebours : des heures parlantes
  // sur les captures du README
  (() => {
    const [h, m] = (new URLSearchParams(location.search).get("now") ?? "17:30").split(":").map(Number);
    const start = new Date();
    start.setHours(h, m, 0, 0);
    const RealDate = Date;
    const offset = start.getTime() - RealDate.now();
    window.Date = class extends RealDate {
      constructor(...args) { super(...(args.length ? args : [RealDate.now() + offset])); }
      static now() { return RealDate.now() + offset; }
    };
  })();
</script>
<script type="module">
  // Substitut minimal de <ha-card> : fond, bord et rayon des cartes de Home Assistant
  customElements.define("ha-card", class extends HTMLElement {
    connectedCallback() {
      Object.assign(this.style, {
        display: "block", background: "var(--ha-card-background)", borderRadius: "12px",
        border: "1px solid var(--divider-color)",
      });
    }
  });
  await import("../dist/lumina-card.js");
  const { makeHass, DEVICE, ENTITIES } = await import("../test/fixtures.mjs");

  const now = Date.now();
  const at = (s) => new Date(now + s * 1000).toISOString();
  const tomorrowAt = (h) => {
    const date = new Date(now + 24 * 3600e3);
    date.setHours(h, 0, 0, 0);
    return date.toISOString();
  };
  // Lampe allumée en blanc : la teinte s'affiche après le titre du panneau
  const lamp = (brightness, kelvin = 3000) => ({
    state: "on",
    attributes: { brightness, supported_color_modes: ["color_temp"], color_mode: "color_temp", color_temp_kelvin: kelvin },
  });
  const SCENES = {
    occupied: { label: "Pièce occupée, jour", hass: makeHass({ states: { "light.chambre": lamp(179) } }) },
    manual: {
      label: "Contrôle manuel",
      hass: makeHass({ room: { lights_override_until: at(30 * 60) },
        states: { "light.chambre": lamp(255) } }),
    },
    vacating: (() => {
      const hass = makeHass({ room: { occupied: false, lights_warning: true, lights_off_at: at(11), fans_off_at: at(160) },
        states: { "light.chambre": lamp(51) } });
      hass.states[ENTITIES.room_state].state = "vacant";
      return { label: "Avertissement avant extinction", hass };
    })(),
    night: {
      label: "Nuit forcée, TV allumée",
      hass: makeHass({
        room: { period: "night", forced_night: true, presence_hold_active: true },
        states: {
          [ENTITIES.forced_night]: { state: "on", attributes: { until: tomorrowAt(7) } },
          "binary_sensor.fp2_chambre": { state: "off", attributes: {} },
          "media_player.tv_chambre": { state: "playing", attributes: { friendly_name: "TV Chambre" } },
          "light.chambre": lamp(77, 2200),
          "fan.chambre": { state: "on", attributes: { percentage: 33, percentage_step: 33 } },
        },
      }),
    },
    paused: {
      label: "Automatisme en pause, pièce vide",
      hass: (() => {
        const hass = makeHass({ states: {
          [ENTITIES.auto_lights]: { state: "off", attributes: {} },
          [ENTITIES.auto_fans]: { state: "off", attributes: {} },
          "light.chambre": { state: "off", attributes: { supported_color_modes: ["color_temp"] } },
          "fan.chambre": { state: "off", attributes: { percentage: 0, percentage_step: 33 } },
        } });
        hass.states[ENTITIES.room_state].state = "vacant";
        return hass;
      })(),
    },
    climate: {
      label: "Clim en marche, ventilateur en brassage",
      hass: makeHass({ climate: true, room: { fans_with_climate: "mix" },
        states: { "light.chambre": lamp(179), "fan.chambre": { state: "on", attributes: { percentage: 33, percentage_step: 33 } } } }),
    },
    away: (() => {
      const hass = makeHass({ climate: true,
        room: { occupied: false, climate_vacant_action: "eco", climate_vacant_at: at(9 * 60 + 40) },
        states: {
          "binary_sensor.fp2_chambre": { state: "off", attributes: {} },
          "light.chambre": { state: "off", attributes: { supported_color_modes: ["color_temp"] } },
          "fan.chambre": { state: "off", attributes: { percentage: 0, percentage_step: 33 } },
        } });
      hass.states[ENTITIES.room_state].state = "vacant";
      return { label: "Pièce vide, clim bientôt en eco", hass };
    })(),
    sleep: (() => {
      const hass = makeHass({ sleep: true,
        room: { period: "night", occupied: false, sleeping: true, sleeping_until: tomorrowAt(7),
          sleep_source: "manual", presumed_occupied: true },
        states: {
          "binary_sensor.fp2_chambre": { state: "off", attributes: {} },
          "light.chambre": { state: "off", attributes: { supported_color_modes: ["color_temp"] } },
          "fan.chambre": { state: "on", attributes: { percentage: 33, percentage_step: 33 } },
        } });
      hass.states[ENTITIES.room_state].state = "sleeping";
      return { label: "En sommeil, dormeur hors de vue du détecteur", hass };
    })(),
    sleepSettings: { label: "Réglages de la nuit et du sommeil", hass: makeHass({ sleep: true }), settings: "night" },
    settings: { label: "Réglages", hass: makeHass(), settings: true },
    climateSettings: { label: "Réglages de la clim", hass: makeHass({ climate: true }), settings: "climate" },
  };

  // Les actions sont journalisées au lieu d'être envoyées
  window.calls = [];
  for (const scene of Object.values(SCENES)) {
    scene.hass.callService = async (domain, service, data) => window.calls.push({ domain, service, data });
  }

  const wanted = new URLSearchParams(location.search).get("scenes")?.split(",") ?? Object.keys(SCENES);
  const themes = new URLSearchParams(location.search).get("themes")?.split(",") ?? ["light", "dark"];
  const root = document.getElementById("root");
  for (const theme of themes) {
    const section = document.createElement("section");
    section.className = `theme theme-${theme}`;
    section.dataset.theme = theme;
    root.appendChild(section);
    for (const key of wanted) {
      const scene = SCENES[key];
      const figure = document.createElement("figure");
      figure.dataset.scene = key;
      figure.innerHTML = `<figcaption>${scene.label}</figcaption>`;
      const card = document.createElement("lumina-card");
      card.setConfig({ type: "custom:lumina-card", device: DEVICE });
      figure.appendChild(card);
      section.appendChild(figure);
      card.hass = scene.hass;
      if (scene.settings) card.shadowRoot.querySelector('[data-action="settings"]').click();
      if (typeof scene.settings === "string") card.shadowRoot.querySelector(`[data-tab="${scene.settings}"]`).click();
    }
  }
  document.body.dataset.ready = "1";
</script>
</body>
</html>
